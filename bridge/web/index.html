<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GEArm 设备桥接（USB CDC）</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div>
      <p class="eyebrow">GEArm · 只读链路</p>
      <h1>USB 设备桥接</h1>
    </div>
    <p id="connection" class="pill">disconnected</p>
  </header>
  <p class="note">页面只与本机桥接通信，不直连设备。允许的命令只有 Ping、Query、遥测速率和 Stop。运动、使能、速度、位置、回零和写参数会在桥接层被拒绝。</p>
  <section class="grid" aria-label="遥测">
    <article><span>连接重试</span><strong id="retry">-</strong></article>
    <article><span>心跳</span><strong id="heartbeat">-</strong></article>
    <article><span>init_stage</span><strong id="init-stage">-</strong></article>
    <article><span>CAN TX 入队</span><strong id="tx-enqueued">-</strong></article>
    <article><span>CAN TX 完成</span><strong id="tx-complete">-</strong></article>
    <article><span>CAN RX</span><strong id="rx-count">-</strong></article>
    <article><span>匹配</span><strong id="matched">-</strong></article>
    <article><span>超时</span><strong id="timeouts">-</strong></article>
    <article><span>最近功能码</span><strong id="last-fn">-</strong></article>
    <article class="wide"><span>原始回包</span><strong id="last-raw">-</strong></article>
  </section>
  <section class="panel">
    <h2>命令</h2>
    <div class="controls">
      <button id="ping" type="button">Ping</button>
      <button id="query-version" type="button">Query 版本</button>
      <button id="query-voltage" type="button">Query 电压</button>
      <button id="query-state" type="button">Query 状态</button>
      <label>遥测 Hz <input id="rate" type="number" min="1" max="100" value="10"></label>
      <button id="rate-btn" type="button">设置遥测速率</button>
      <button id="stop" type="button">Stop 停止遥测</button>
    </div>
    <p class="hint">Stop 发送白名单 0x04，只停止遥测，不是电机急停。</p>
  </section>
  <section class="panel">
    <h2>命令日志</h2>
    <ol id="log"></ol>
  </section>
  <script src="app.js"></script>
</body>
</html>
